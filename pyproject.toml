[project]
name = "endeavor-hands"
version = "0.1.0"
description = "Local macOS MCP stdio server that lets ChatGPT (or any MCP client) run shell/Python, read/write/edit files, and drive guarded screen automation on this Mac"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.26,<2",
    "langchain-core",
    "opencv-python",
    "Pillow",
    "markitdown",
    "PyMuPDF",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]
